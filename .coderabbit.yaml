# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
reviews:
  path_filters:
    - "!Tests/UI/__Snapshots__/**"
    - "!**/*.xcassets/**"
    - "!Examples/**/project.pbxproj"
    - "!e2e-tests/package-lock.json"
  auto_approvals:
    enabled: true
    allow_author_approval: false
    max_merge_risk: moderate
  pre_merge_checks:
    override_requested_reviewers_only: true
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Testing, risk, and revert"
        mode: error
        instructions: |
          The PR description has a Testing, a Risk, and a How to revert section, and each one says something specific to this PR.
          FAIL if any of the three is missing, empty, a lone "-", only the template's HTML comment, or a placeholder with no reason, such as "TBD", "N/A", "none", or "n/a".
          PASS when each section names something about this PR. A short answer with a reason passes, such as "Low: docs only" for Risk or "A plain revert is enough" for How to revert.
      - name: "Device evidence"
        mode: error
        instructions: |
          PASS if the diff changes no file under `Sources/ClerkKit/`, `Sources/ClerkKitUI/`, or `Examples/E2EHost/`.
          Otherwise PASS only if the PR description does one of these:
          (a) Shows a before and an after, as screenshots or video on a simulator or device, for every screen the diff touches and the states of those screens that the rules below require. The pairs sit in a table, each before beside its after.
          (b) Says why the change could not be run on one.
          A state is a condition that decides whether the changed lines run, what they show, or what the screen shows because of them: a branch in the changed code, in code it calls, a branch that encloses the changed lines or a call to the changed code (an `if` or `switch` the call sits inside, even in a caller), a branch in a caller that picks a value the changed code shows (such as a title chosen with `if` and passed in), a branch on a result of the changed code (such as an `if` on a Boolean it returns, even when the result is stored first), or a branch on a value the changed lines assign (such as a `switch` in another view on a property the changed lines set). Examples are signed in or out, loading, empty, an error, or which layout a component picks. Find the states in the diff, the code it calls, and the code that calls it. The description doesn't have to list them.
          Nothing else that varies on a screen is a state for this check. A branch elsewhere in a touched file or screen that isn't one of the kinds above is not a state, even when it changes the same screen. So parts of the screen the changed code doesn't reach, such as which other form fields show, a toggle's position, or text the user typed, are not states. A branch inside content that the changed code wraps or modifies, such as a closure passed to it or the view a changed modifier is applied to, isn't a state just because the changed code wraps or calls that content. It counts only when one of the other kinds above applies to it, such as when it encloses changed lines. Each state whose look the change alters needs its own pair, but a combination of states doesn't, unless one of the branches above, including one in code the changed code calls, tests that combination.
          Of the states that should look the same after the change, one pair is required when there is any such state, and more are optional. Once the description has one such pair, no other state that should look the same is missing, so don't list any.
          A state that no real user can reach in the shipped app needs no pair, even when a local patch could force it, such as a branch that only an internal task cancellation reaches or a value Clerk's backend never sends. The description names the branch's file and line and says why no user can reach it. A state that a real user can reach but a test user can't still needs a pair, forced with a local patch.
          A screen that doesn't exist on the base branch, as the diff shows, has no before, so it needs only an after of each of its states.
          A language is not a separate state. Screens shown in English, the default language, cover every language.
          When the diff adds or changes translations, the description also shows them on one screen, ideally the one where the text has the least room, or says why it doesn't. That one screen is enough, in whichever languages the author picks, with or without a before.
          FAIL when the diff touches those paths and any of these is true:
          - Neither (a) nor (b) holds. For example, the evidence is missing, leaves out a touched screen or one of its required states, or, for a screen that exists on the base branch, has no before or isn't laid out as a before and after table.
          - The diff adds or changes translations, and the description neither shows them on one screen nor says why it doesn't.
          - A local patch forced a state, and the description doesn't say what the patch changed, why, and that both the before and the after build used it, or the after build alone for a screen that doesn't exist on the base branch. This fails even when (a) holds.
          A before build that only leaves out this PR's changes to the app, so the PR's tests can run against the old behavior, is not a local patch.
          A link to CI, a test run, or snapshot images is not device evidence.
          For each missing state, cite the file and line of the branch that produces it, and say which of the kinds above it is and what it changes on the screen. A state you can't tie to such a branch is not missing, and it doesn't fail this check. A state that the description explains as unreachable by any real user, naming its branch, is not missing. Neither is a state the description says can't run on a simulator or device even with a local patch, naming its branch and a concrete reason, such as hardware the simulator lacks or a third-party sign-in a test can't complete.
          Go through every touched screen and every state before you answer, and list everything that is missing in this one result, so the author can add it all at once.
      - name: "Device evidence: other states"
        mode: warning
        instructions: |
          This check only advises. The "Device evidence" check decides what the PR must show.
          PASS if the diff changes no file under `Sources/ClerkKit/`, `Sources/ClerkKitUI/`, or `Examples/E2EHost/`, or the description says why the change could not be run on a simulator or device.
          Otherwise, look for states that the "Device evidence" check doesn't require: parts of the screen the changed code doesn't reach, branches inside content that the changed code wraps or modifies, combinations of states, or conditions you can't tie to such a branch. Languages are not states here either.
          List such a state only when you can name a concrete way this change could affect it, such as a shared layout or container that the changed code sits in, a change in size or spacing, or text that could overflow or wrap. A state that only looks different, with no such reason, doesn't count.
          Leave out any state the description already shows. FAIL if any remain, and list them all in this one result, each with its reason. Otherwise PASS.
  finishing_touches:
    autofix:
      enabled: false
    unit_tests:
      enabled: false
    docstrings:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    simplify:
      enabled: false
  collapse_walkthrough: false
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Write an explainer for a teammate who doesn't know this part of the code. In three to six plain sentences, say how the touched area worked before this PR, what changes, and where a reviewer should look first. Don't repeat the file list.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "AGENTS.md"
      - "REVIEW.md"
