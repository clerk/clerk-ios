# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Preserve organization settings.
inheritance: true
reviews:
  # Approve once the latest commit is reviewed, threads are resolved and no checks fail.
  request_changes_workflow: true
  allow_author_approval: false
  # Authors cannot override a failing check. Requested reviewers and org
  # members or collaborators who submit a review can.
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: "Needs human review"
        # A FAIL blocks CodeRabbit approval, so a human reviews.
        mode: error
        instructions: |
          Decide whether a human should review this PR, and if so, say why.
          Always require one for auth/session/token handling, keychain/keystore,
          public API, build/release config, `.coderabbit.yaml`, or `.github/`.
          PASS if no human review is needed. FAIL if one is.
