# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true
reviews:
  request_changes_workflow: true
  pre_merge_checks:
    custom_checks:
      - name: "Needs human review"
        mode: error
        instructions: |
          Decide whether a human should review this PR, and if so, say why.
          PASS if no human review is needed. FAIL if one is.
