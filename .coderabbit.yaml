# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Preserve organization settings.
inheritance: true
reviews:
  # Approve once the latest commit is reviewed, threads are resolved and no checks fail.
  request_changes_workflow: true
  allow_author_approval: false
  # Authors cannot override a failing check. Requested reviewers and org
  # members or collaborators who submit a review can.
  pre_merge_checks:
    override_requested_reviewers_only: true
    custom_checks:
      - name: "Needs human review"
        # A FAIL blocks CodeRabbit approval, so a human reviews.
        mode: error
        instructions: |
          Decide whether a human should review this PR before it merges.
          Use your own judgment. Always require a human if it touches auth/session/token
          handling, keychain/keystore, public API, build/release config, `.coderabbit.yaml`,
          or anything under `.github/`.
          PASS if no human review is needed. FAIL if one is.
          When you FAIL, start the explanation with the reason: name the files that need
          a human and the rule above or the concern that applies to each.
