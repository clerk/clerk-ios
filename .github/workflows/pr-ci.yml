name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    if: github.event.pull_request.draft == false
    # The shared checks also hold the release's check run jobs, which ask for these. GitHub rejects
    # the call when a called job asks for more than the caller grants, even a job that is skipped.
    permissions:
      actions: read
      checks: write
      contents: read
    uses: ./.github/workflows/shared-checks.yml
    with:
      build_platforms: '["iOS", "macOS"]'
      e2e_runner_tests_base: ${{ github.base_ref }}

  # The one required check. A skipped job counts as passing, so this one runs even when the checks
  # failed or were cancelled, and fails then.
  ci-passed:
    name: CI passed
    needs: checks
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the checks to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::The checks finished with the result '$RESULT'."
            exit 1
          fi
