name: Checks

on:
  push:
    branches:
      - main
      - sean/Explore-maestro

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    permissions:
      actions: read
      checks: write
      contents: read
    uses: ./.github/workflows/shared-checks.yml
    with:
      run_integration_tests: ${{ github.ref == 'refs/heads/sean/Explore-maestro' }}
    secrets: inherit
