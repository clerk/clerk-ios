name: Checks

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    permissions:
      actions: read
      checks: write
      contents: read
    uses: ./.github/workflows/shared-checks.yml
    with:
      build_platforms: '["iOS", "macOS"]'

  delete-replaced-builds:
    name: Delete the builds this push replaced
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the older saved builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for prefix in clerkkitui-derived-data- clerkkit-swiftpm-build-; do
            keys="$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" --limit 100 --json key --jq '.[].key')"
            if ! grep -q -- "-$GITHUB_SHA\$" <<< "$keys"; then
              echo "::notice::No $prefix build was saved for $GITHUB_SHA, so none is deleted."
              continue
            fi
            while IFS= read -r key; do
              [ -z "$key" ] || [[ "$key" == *"-$GITHUB_SHA" ]] || gh cache delete "$key" --repo "$GITHUB_REPOSITORY"
            done <<< "$keys"
          done
