name: Team review request

# pull_request_target and issue_comment run this file and its script from main, so they can request reviewers on fork pull requests too.
# The job never checks out or runs the pull request's code.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  team-review-request:
    name: Team review request
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event.issue.pull_request && github.event.comment.user.login == 'coderabbitai[bot]' &&
      (contains(github.event.comment.body, 'High**') || contains(github.event.comment.body, 'Critical**')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: team-review-request-${{ github.event.pull_request.number || github.event.issue.number }}
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - name: Checkout the scripts from main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The Actions token can't see org teams, so this app reads @clerk/team-mobile and requests it.
      - name: Mint the team review token
        id: team-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.TEAM_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEAM_REVIEW_APP_PRIVATE_KEY }}
          permission-members: read
          permission-pull-requests: write
      - name: Request Team Mobile when the PR needs a Team Mobile approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TEAM_REVIEW_TOKEN: ${{ steps.team-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node .github/scripts/team-review-request.mjs
