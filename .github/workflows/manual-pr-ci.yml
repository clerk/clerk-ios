name: PR CI

on:
  issue_comment:
    types:
      - created
      - edited
  status:
  pull_request_target:
    types:
      - ready_for_review

permissions:
  contents: read

jobs:
  find-pull-requests:
    name: Find CI requests
    # CodeRabbit writes its summary and status separately; either can arrive last.
    # No pull request code runs in this privileged routing job.
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'CodeRabbit' && github.event.state == 'success' &&
       github.event.description == 'Review completed' && github.event.sender.id == 136622811)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_requests: ${{ steps.find.outputs.pull_requests }}
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find pull requests
        id: find
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { findPullRequests } = require('./.github/scripts/pr-ci.cjs');
            core.setOutput('pull_requests', await findPullRequests({ github, context }));

  pr-ci:
    name: PR CI (#${{ matrix.pr_number }})
    needs: find-pull-requests
    if: needs.find-pull-requests.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      # A status can belong to multiple PRs sharing the same commit. Let the
      # first finish claiming/running CI before the next reuses that history.
      max-parallel: 1
      matrix:
        pr_number: ${{ fromJSON(needs.find-pull-requests.outputs.pull_requests) }}
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
      statuses: read
    uses: ./.github/workflows/run-pr-ci.yml
    with:
      pr_number: ${{ matrix.pr_number }}
