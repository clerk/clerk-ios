name: PR CI

on:
  issue_comment:
    types:
      - created
      - edited
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  find-pull-requests:
    name: Find CI requests
    # No pull request code runs in this privileged routing job. Unrelated comments
    # are filtered here so they don't each start a runner.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       ((github.event.action == 'created' && contains(github.event.comment.body, '/run')) ||
        (github.event.action == 'edited' && contains(github.event.comment.body, '<!-- clerk-ios-manual-ci -->'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pull_requests: ${{ steps.find.outputs.pull_requests }}
    steps:
      - name: Checkout trusted CI scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Find pull requests
        id: find
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { findPullRequests } = require('./.github/scripts/pr-ci.cjs');
            core.setOutput('pull_requests', await findPullRequests({ github, context }));

  pr-ci:
    name: PR CI (#${{ matrix.pr_number }})
    needs: find-pull-requests
    if: needs.find-pull-requests.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr_number: ${{ fromJSON(needs.find-pull-requests.outputs.pull_requests) }}
    # A push cancels the previous push's run. Manual requests get a group of their
    # own and never cancel a run. Otherwise the request would see the cancelled
    # run's Manual CI still in progress and skip, so nothing would run.
    concurrency:
      group: pr-ci-${{ matrix.pr_number }}-${{ github.event_name == 'pull_request_target' && 'push' || github.run_id }}
      cancel-in-progress: true
    permissions:
      actions: read
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/run-pr-ci.yml
    with:
      pr_number: ${{ matrix.pr_number }}
