name: verify-remote
run-name: verify-remote ${{ inputs.owner }}/${{ inputs.session }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Random id of the driver's checkout, so it can find and end its own sessions
        required: true
      session:
        description: Session id the driver chose
        required: true
      request:
        description: The session request as one JSON string (src/core/remote/protocol.ts)
        required: true

permissions:
  contents: read

env:
  PACKAGE: e2e-tests
  IOS_RUNTIME: iOS-27-0

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      runner: ${{ steps.plan.outputs.runner }}
      device: ${{ steps.plan.outputs.device }}
      sha: ${{ steps.plan.outputs.sha }}
      timeout: ${{ steps.plan.outputs.timeout }}
      request: ${{ steps.plan.outputs.request }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e-tests/src/core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the request
        id: plan
        env:
          VERIFY_REQUEST: ${{ inputs.request }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node "$PACKAGE/src/core/remote/session-agent.ts" plan
      - name: Check the runner label
        if: steps.plan.outputs.mode == 'session'
        env:
          RUNNER_LABEL: ${{ steps.plan.outputs.runner }}
        run: |
          case "$RUNNER_LABEL" in
            xcode-27 | ubuntu-latest | blacksmith-6vcpu-macos-27) ;;
            *)
              echo "::error title=verify-remote::no session started: the runner label $RUNNER_LABEL is not xcode-27, ubuntu-latest, or blacksmith-6vcpu-macos-27"
              exit 1
              ;;
          esac

  session:
    needs: plan
    if: needs.plan.outputs.mode == 'session'
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    env:
      VERIFY_SESSION_REQUEST: ${{ needs.plan.outputs.request }}
      # agent-device reaps its daemon, its XCTest runner, and its device lease after five idle minutes by default.
      AGENT_DEVICE_DAEMON_IDLE_TIMEOUT_MS: "0"
      AGENT_DEVICE_IOS_RUNNER_IDLE_STOP_MS: "0"
      AGENT_DEVICE_LEASE_TTL_MS: "21600000"
      AGENT_DEVICE_LEASE_MAX_TTL_MS: "21600000"
      SESSION_BUILD: e2e-tests/src/platform/ios/session-build.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Name the session's directories
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/verify-remote"
          mkdir -p "$WORK"
          echo "VERIFY_SESSION_WORK=$WORK" >> "$GITHUB_ENV"
          echo "start $(date +%s)000" >> "$WORK/marks"

      - name: Pick the simulator
        id: device
        if: runner.os == 'macOS' && needs.plan.outputs.device != ''
        env:
          DEVICE: ${{ needs.plan.outputs.device }}
        run: |
          set -euo pipefail
          xcodebuild -version
          UDID=$(xcrun simctl list -j | node -e '
            const { runtimes, devices } = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const [name, wanted] = process.argv.slice(1);
            const short = (id) => id.replace(/^.*SimRuntime\./, "");
            const ios = runtimes.filter((r) => r.isAvailable && short(r.identifier).startsWith("iOS-"));
            const runtime = ios.find((r) => short(r.identifier) === wanted);
            if (!runtime) {
              console.error(`::error::This runner has no ${wanted} simulator runtime. It has: ${ios.map((r) => short(r.identifier)).join(", ") || "none"}. Change IOS_RUNTIME in this workflow on purpose, or choose another runner.`);
              process.exit(1);
            }
            const list = (devices[runtime.identifier] ?? []).filter((d) => d.isAvailable);
            const match = list.find((d) => d.name === name);
            if (!match) {
              console.error(`::error::No simulator named ${name} on ${wanted}. That runtime has: ${list.map((d) => d.name).join(", ") || "none"}.`);
              process.exit(1);
            }
            console.error(`${match.name} on ${wanted}`);
            process.stdout.write(match.udid);
          ' "$DEVICE" "$IOS_RUNTIME")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Restore the Swift packages
        id: packages
        if: steps.device.outputs.udid != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/packages
          key: verify-packages-unresolved
          restore-keys: verify-packages-

      # Xcode treats a file with a new inode as changed, and a new checkout gives every file a new inode. This setting makes it compare contents and times only, so that restored build state still counts as built.
      - name: Resolve the Swift packages and name the app
        id: app
        if: steps.device.outputs.udid != ''
        timeout-minutes: 15
        run: |
          set -euo pipefail
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          node "$SESSION_BUILD" name "$VERIFY_SESSION_WORK"

      - name: Restore the app that an earlier build stored
        id: stored
        if: steps.app.outputs.key != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/apps/${{ steps.app.outputs.key }}
          key: verify-e2ehost-${{ steps.app.outputs.key }}

      - name: Restore the build state for an app that is not stored
        if: steps.device.outputs.udid != '' && steps.stored.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/derived
          key: verify-derived-${{ steps.app.outputs.toolchain }}-${{ steps.app.outputs.key || github.run_id }}
          restore-keys: verify-derived-${{ steps.app.outputs.toolchain }}-

      - name: Install the package's pinned tools
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm ci --prefix "$PACKAGE" --no-audit --no-fund
          "$PACKAGE/node_modules/.bin/agent-device" --version
          echo "tools-installed $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"

      - name: Restore the XCTest runner
        id: runner
        if: steps.device.outputs.udid != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.agent-device/apple-runner
          key: verify-agent-device-${{ runner.os }}-${{ hashFiles('e2e-tests/package-lock.json') }}-${{ steps.app.outputs.toolchain }}-${{ env.IOS_RUNTIME }}

      - name: Start the session agent and tunnel
        id: tunnel
        env:
          VERIFY_SESSION_DEVICE_ID: ${{ steps.device.outputs.udid }}
          VERIFY_SESSION_DEVICE_NAME: ${{ needs.plan.outputs.device }}
          VERIFY_SESSION_DEVICE_MODULE: e2e-tests/src/platform/ios/session-device.ts
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARED_VERSION: "2026.9.3"
        run: |
          set -euo pipefail
          WORK="$VERIFY_SESSION_WORK"
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) ASSET=cloudflared-darwin-arm64.tgz; SUM=587c2cfb1c230fe36c7fa7727da78be459dae028cabe8c001291999350f07095 ;;
            Linux-x86_64) ASSET=cloudflared-linux-amd64; SUM=77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2 ;;
            *) echo "::error::no cloudflared build for $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors -o "$WORK/$ASSET" "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/$ASSET"
          echo "$SUM  $WORK/$ASSET" | shasum -a 256 -c -
          if [ "${ASSET%.tgz}" != "$ASSET" ]; then tar -xzf "$WORK/$ASSET" -C "$WORK"; else mv "$WORK/$ASSET" "$WORK/cloudflared"; fi
          chmod +x "$WORK/cloudflared"
          VERIFY_SESSION_WORK="$WORK" VERIFY_SESSION_CLOUDFLARED="$WORK/cloudflared" \
            nohup node "$PACKAGE/src/core/remote/session-agent.ts" serve > "$WORK/agent.log" 2>&1 &
          disown
          echo "agent-started $(date +%s)000" >> "$WORK/marks"
          for _ in $(seq 1 600); do
            [ -s "$WORK/tunnel" ] && break
            pgrep -f 'session-agent.ts serve' > /dev/null || { echo "::error::the session agent ended before a tunnel came up"; break; }
            sleep 1
          done
          [ -s "$WORK/tunnel" ] || { echo "::error::no tunnel came up"; tail -n 20 "$WORK/agent.log" "$WORK/tunnel.log" || true; exit 1; }
          echo "tunnel-up $(date +%s)000" >> "$WORK/marks"
          echo "host=$(cat "$WORK/tunnel")" >> "$GITHUB_OUTPUT"

      # GitHub's jobs API returns a step's name while the job still runs, so the tunnel host travels in this name.
      - name: verify-remote tunnel ${{ steps.tunnel.outputs.host }}
        run: "true"

      # The session's build boots the simulator once it has an app, because the first boot of a simulator slows a compile on this runner to a quarter of its speed. When no build is running, this step boots it.
      - name: Wait for the simulator
        if: steps.device.outputs.udid != ''
        timeout-minutes: 60
        env:
          UDID: ${{ steps.device.outputs.udid }}
        run: |
          idle=0
          for _ in $(seq 1 3000); do
            [ -f "$VERIFY_SESSION_WORK/booted" ] && break
            if pgrep -f 'session-build.ts build' > /dev/null; then idle=0; else idle=$((idle + 1)); fi
            [ "$idle" -ge 20 ] && break
            sleep 1
          done
          [ -f "$VERIFY_SESSION_WORK/booted" ] || xcrun simctl bootstatus "$UDID" -b

      - name: Prepare the XCTest runner
        id: prepare
        if: steps.device.outputs.udid != ''
        timeout-minutes: 20
        run: |
          set -uo pipefail
          echo "runner-started $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"
          log="$VERIFY_SESSION_WORK/prepare.log"
          prepared=no
          for attempt in 1 2 3; do
            "$PACKAGE/node_modules/.bin/agent-device" prepare ios-runner --platform ios --timeout 900000 2>&1 | tee -a "$log" && prepared=yes && break
            echo "prepare ios-runner failed on attempt $attempt of 3"
          done
          if [ "$prepared" = no ]; then
            echo "::warning::prepare ios-runner failed three times; the first snapshot pays for it"
            exit 0
          fi
          if grep -q 'Building Apple runner' "$log"; then how=built; else how=reused; fi
          echo "how=$how" >> "$GITHUB_OUTPUT"
          echo "runner-$how $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"

      - name: Mark the device ready
        run: |
          touch "$VERIFY_SESSION_WORK/device-ready"
          echo "device-ready $(date +%s)000" >> "$VERIFY_SESSION_WORK/marks"

      - name: Report the app and the stage times
        id: report
        if: steps.device.outputs.udid != ''
        run: |
          for _ in $(seq 1 600); do
            pgrep -f 'session-build.ts build' > /dev/null || break
            sleep 1
          done
          node "$SESSION_BUILD" outcome "$VERIFY_SESSION_WORK"
          node "$SESSION_BUILD" stages "$VERIFY_SESSION_WORK"

      - name: Store the app for the next session with the same sources, packages and Xcode
        if: steps.report.outputs.store != '' && steps.report.outputs.store == steps.app.outputs.key
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/apps/${{ steps.report.outputs.store }}
          key: verify-e2ehost-${{ steps.report.outputs.store }}

      - name: Store the XCTest runner
        if: steps.prepare.outputs.how == 'built' && steps.runner.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.agent-device/apple-runner
          key: verify-agent-device-${{ runner.os }}-${{ hashFiles('e2e-tests/package-lock.json') }}-${{ steps.app.outputs.toolchain }}-${{ env.IOS_RUNTIME }}

      - name: Store the Swift packages
        if: steps.app.outputs.pins != '' && steps.packages.outputs.cache-matched-key != format('verify-packages-{0}', steps.app.outputs.pins)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/packages
          key: verify-packages-${{ steps.app.outputs.pins }}

      - name: Store the build state
        if: steps.report.outputs.built != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/verify-remote/derived
          key: verify-derived-${{ steps.app.outputs.toolchain }}-${{ steps.report.outputs.built }}

      - name: Hold the session
        env:
          UDID: ${{ steps.device.outputs.udid }}
        run: |
          set -uo pipefail
          held=0
          while [ ! -f "$VERIFY_SESSION_WORK/ended" ]; do
            pgrep -f 'session-agent.ts serve' > /dev/null || [ -f "$VERIFY_SESSION_WORK/ended" ] || { echo "::error::the session agent died"; tail -30 "$VERIFY_SESSION_WORK/agent.log"; exit 1; }
            if [ -n "$UDID" ] && [ -z "${quiet:-}" ] && [ $((held % 60)) -eq 0 ]; then
              limit=$(( $(sysctl -n hw.ncpu) * 20 ))
              load="$(sysctl -n vm.loadavg | awk '{ print int($2) }')"
              echo "the 1-minute load average is $load, $held seconds after the device was ready; the first-boot work of the simulator is over below $limit"
              [ "$load" -lt "$limit" ] && quiet=yes
            fi
            sleep 3
            held=$((held + 3))
          done
          echo "session ended: $(cat "$VERIFY_SESSION_WORK/ended")"

      - name: Shut down
        if: always()
        env:
          UDID: ${{ steps.device.outputs.udid }}
        run: |
          pkill -f 'session-agent.ts serve' || true
          if [ -n "$UDID" ]; then xcrun simctl shutdown "$UDID" || true; fi

      - name: Keep the evidence that attach handed off
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-evidence
          path: ${{ runner.temp }}/verify-remote/evidence/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
