name: Shared Checks

on:
  workflow_call:
    inputs:
      run_integration_tests:
        description: Run integration tests as part of shared checks
        required: false
        type: boolean
        default: false
      checkout_repository:
        description: Repository to checkout for shared checks
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Git ref or SHA to checkout for shared checks
        required: false
        type: string
        default: ""
      report_check_runs:
        description: Report per-job check runs for manual PR CI
        required: false
        type: boolean
        default: false
      check_run_sha:
        description: Commit SHA to receive manual CI check runs
        required: false
        type: string
        default: ""
      check_run_target_url:
        description: Target URL for manual CI check runs
        required: false
        type: string
        default: ""
      check_run_name_prefix:
        description: Prefix for manual CI check run names
        required: false
        type: string
        default: Manual CI
    secrets:
      CLERK_TEST_KEYS_JSON:
        required: false

permissions:
  contents: read

jobs:
  prepare-manual-ci-check-runs:
    name: Prepare manual CI check runs
    if: inputs.report_check_runs && inputs.check_run_sha != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      check_runs_json: ${{ steps.create.outputs.check_runs_json }}
    steps:
      - name: Create in-progress check runs
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_NAME_PREFIX: ${{ inputs.check_run_name_prefix }}
          CHECK_RUN_SHA: ${{ inputs.check_run_sha }}
          CHECK_RUN_TARGET_URL: ${{ inputs.check_run_target_url }}
          RUN_INTEGRATION_TESTS: ${{ inputs.run_integration_tests }}
        run: |
          set -euo pipefail

          target_url="$CHECK_RUN_TARGET_URL"
          if [ -z "$target_url" ]; then
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          check_run_names=(
            "$CHECK_RUN_NAME_PREFIX / Check formatting and linting"
            "$CHECK_RUN_NAME_PREFIX / Run ClerkKit tests on macOS"
            "$CHECK_RUN_NAME_PREFIX / Run ClerkKitUI tests on iOS"
            "$CHECK_RUN_NAME_PREFIX / Build iOS"
            "$CHECK_RUN_NAME_PREFIX / Build macOS"
            "$CHECK_RUN_NAME_PREFIX / Build macCatalyst"
            "$CHECK_RUN_NAME_PREFIX / Build watchOS"
            "$CHECK_RUN_NAME_PREFIX / Build tvOS"
            "$CHECK_RUN_NAME_PREFIX / Build visionOS"
          )

          if [ "$RUN_INTEGRATION_TESTS" = "true" ]; then
            check_run_names+=(
              "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (auth-email)"
              "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (auth-phone)"
              "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (user-profile)"
              "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (session-task-setup-mfa)"
            )
          fi

          check_runs_json="$(jq -cn '{}')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for name in "${check_run_names[@]}"; do
            check_run_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
                -f name="$name" \
                -f head_sha="$CHECK_RUN_SHA" \
                -f status=in_progress \
                -f details_url="$target_url" \
                -f started_at="$started_at" \
                --jq '.id'
            )"
            check_runs_json="$(jq -c --arg name "$name" --argjson id "$check_run_id" '. + {($name): $id}' <<< "$check_runs_json")"
          done

          echo "check_runs_json=$check_runs_json" >> "$GITHUB_OUTPUT"

  format-and-lint:
    name: Check formatting and linting
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Install SwiftFormat
        run: ./scripts/install-swiftformat.sh

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Show formatter and linter versions
        run: |
          ./.tools/bin/swiftformat --version
          ./.tools/bin/swiftlint version

      - name: Check version consistency
        run: |
          set -euo pipefail
          ./scripts/check-version-consistency.sh

      - name: Check formatting and linting
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          make check

  test:
    name: Run ClerkKit tests on macOS
    needs: format-and-lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macOS-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-macOS-

      - name: Run unit tests
        run: make test

      - name: Run macOS smoke build
        run: make smoke-macos

      - name: Setup integration test keys
        if: inputs.run_integration_tests
        env:
          CLERK_TEST_KEYS_JSON: ${{ secrets.CLERK_TEST_KEYS_JSON }}
        run: |
          set +x
          if [ -z "$CLERK_TEST_KEYS_JSON" ]; then
            echo "❌ Error: CLERK_TEST_KEYS_JSON secret is not set"
            echo "   Please configure CLERK_TEST_KEYS_JSON secret in repository settings"
            exit 1
          fi

          printf '%s\n' "$CLERK_TEST_KEYS_JSON" > .keys.json
          chmod 600 .keys.json
          echo "✅ Created .keys.json from CLERK_TEST_KEYS_JSON secret"

      - name: Run integration tests
        if: inputs.run_integration_tests
        run: |
          set -euo pipefail
          make test-integration

      - name: Cleanup integration test keys
        if: always() && inputs.run_integration_tests
        run: |
          rm -f .keys.json
          echo "✅ Cleaned up .keys.json"

  test-ui:
    name: Run ClerkKitUI tests on iOS
    needs: format-and-lint
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-ios-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-ios-

      - name: Run ClerkKitUI tests
        run: make test-ui

  test-e2e:
    name: Run required E2EHost Maestro tests on iOS (${{ matrix.shard }})
    needs: format-and-lint
    if: inputs.run_integration_tests
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: auth-email
            key_name: auth-email-code-password
          - shard: auth-phone
            key_name: auth-phone-code
          - shard: user-profile
            key_name: auth-email-code-password
          - shard: session-task-setup-mfa
            key_name: session-task-setup-mfa
    env:
      MAESTRO_RUNNER_VERSION: "1.1.21"
      E2E_MAESTRO_REPORT_PATH: build/reports/maestro-${{ matrix.shard }}
      IOS_SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Cache Xcode Swift package checkouts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: build/xcode-source-packages
          key: swiftpm-e2e-${{ hashFiles('Package.swift') }}
          restore-keys: swiftpm-e2e-

      - name: Cache maestro-runner and compiled WDA
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.maestro-runner
          key: maestro-runner-${{ runner.os }}-${{ runner.arch }}-${{ env.MAESTRO_RUNNER_VERSION }}

      - name: Install maestro-runner
        run: |
          set -euo pipefail

          if [ -x "$HOME/.maestro-runner/bin/maestro-runner" ]; then
            echo "Using cached maestro-runner"
          else
            installed=0
            for attempt in 1 2 3; do
              if curl -fsSL --retry 3 --retry-delay 5 "https://open.devicelab.dev/install/maestro-runner" |
                bash -s -- --version "$MAESTRO_RUNNER_VERSION"; then
                if [ -x "$HOME/.maestro-runner/bin/maestro-runner" ]; then
                  installed=1
                  break
                fi
              fi
              echo "maestro-runner install attempt $attempt failed; retrying"
              sleep 5
            done
            if [ "$installed" != "1" ]; then
              echo "::error::maestro-runner installation failed after 3 attempts"
              exit 1
            fi
          fi

          echo "$HOME/.maestro-runner/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro-runner/bin/maestro-runner" --version

      - name: Setup E2E test keys
        env:
          CLERK_TEST_KEYS_JSON: ${{ secrets.CLERK_TEST_KEYS_JSON }}
        run: |
          set +x
          if [ -z "$CLERK_TEST_KEYS_JSON" ]; then
            echo "❌ Error: CLERK_TEST_KEYS_JSON secret is not set"
            echo "   Please configure CLERK_TEST_KEYS_JSON secret in repository settings"
            exit 1
          fi

          printf '%s\n' "$CLERK_TEST_KEYS_JSON" > .keys.json
          chmod 600 .keys.json
          echo "✅ Created .keys.json from CLERK_TEST_KEYS_JSON secret"

      - name: Run required E2EHost Maestro test
        id: run_e2e
        env:
          CLERK_E2E_KEY_NAME: ${{ matrix.key_name }}
          E2E_MAESTRO_FLOW_NAME: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          test_password="ClerkIOS2026E2E$(openssl rand -hex 16)!"
          echo "::add-mask::$test_password"
          printf 'TEST_PASSWORD=%s\n' "$test_password" >> "$GITHUB_ENV"
          CLERK_TEST_PASSWORD="$test_password" make test-e2e

      - name: Scrub credentials from Maestro reports
        if: always() && steps.run_e2e.outcome == 'failure'
        run: |
          set -euo pipefail

          report_path="$E2E_MAESTRO_REPORT_PATH"
          [ -d "$report_path" ] || exit 0
          # shellcheck disable=SC2016
          find "$report_path" -type f \
            \( -name '*.html' -o -name '*.json' -o -name '*.log' -o -name '*.txt' -o -name '*.xml' -o -name '*.yaml' \) \
            -exec perl -pi -e 's/\Q$ENV{TEST_PASSWORD}\E/[REDACTED]/g' {} +

      - name: Upload Maestro failure reports
        if: always() && steps.run_e2e.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E2EHost-maestro-${{ matrix.shard }}-artifacts
          path: ${{ env.E2E_MAESTRO_REPORT_PATH }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup E2E test keys
        if: always()
        run: |
          rm -f .keys.json
          echo "✅ Cleaned up .keys.json"

  build:
    name: Build ${{ matrix.platform }}
    needs: [test, test-ui]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      matrix:
        platform: [iOS, macOS, macCatalyst, watchOS, tvOS, visionOS]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          echo "Building for ${{ matrix.platform }} using xcodebuild..."
          case "${{ matrix.platform }}" in
            iOS) destination="generic/platform=iOS Simulator" ;;
            macOS) destination="platform=macOS" ;;
            macCatalyst) destination="platform=macOS,variant=Mac Catalyst" ;;
            watchOS) destination="generic/platform=watchOS Simulator" ;;
            tvOS) destination="generic/platform=tvOS Simulator" ;;
            visionOS) destination="generic/platform=visionOS Simulator" ;;
            *) echo "❌ Unknown platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          xcodebuild build -workspace Clerk.xcworkspace -scheme ClerkKit -destination "$destination"

  report-manual-ci-check-runs:
    name: Report manual CI check runs
    needs:
      - prepare-manual-ci-check-runs
      - format-and-lint
      - test
      - test-ui
      - test-e2e
      - build
    if: always() && inputs.report_check_runs && inputs.check_run_sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - name: Report final check runs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_NAME_PREFIX: ${{ inputs.check_run_name_prefix }}
          CHECK_RUNS_JSON: ${{ needs.prepare-manual-ci-check-runs.outputs.check_runs_json }}
          CHECK_RUN_TARGET_URL: ${{ inputs.check_run_target_url }}
          RUN_INTEGRATION_TESTS: ${{ inputs.run_integration_tests }}
        run: |
          set -euo pipefail

          target_url="$CHECK_RUN_TARGET_URL"
          if [ -z "$target_url" ]; then
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          job_result() {
            local job_suffix="$1"
            jq -r --arg job_suffix "$job_suffix" '
              [.jobs[] | select(.name | endswith($job_suffix)) | .conclusion] | last // "skipped"
            ' <<< "$jobs_json"
          }

          check_run_id() {
            local name="$1"
            jq -r --arg name "$name" '.[$name] // empty' <<< "$CHECK_RUNS_JSON"
          }

          update_check_run() {
            local name="$1"
            local result="$2"
            local check_run_id
            local conclusion
            local summary

            check_run_id="$(check_run_id "$name")"
            if [ -z "$check_run_id" ]; then
              echo "::warning::No check run id found for '$name'."
              return
            fi

            case "$result" in
              success)
                conclusion="success"
                summary="Manual CI completed successfully."
                ;;
              cancelled)
                conclusion="cancelled"
                summary="Manual CI was cancelled."
                ;;
              skipped)
                conclusion="skipped"
                summary="Manual CI did not run because a dependency did not complete."
                ;;
              *)
                conclusion="failure"
                summary="Manual CI failed."
                ;;
            esac

            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_run_id" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f details_url="$target_url" \
              -f "output[title]=$name" \
              -f "output[summary]=$summary"
          }

          update_check_run "$CHECK_RUN_NAME_PREFIX / Check formatting and linting" "$(job_result "Check formatting and linting")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Run ClerkKit tests on macOS" "$(job_result "Run ClerkKit tests on macOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Run ClerkKitUI tests on iOS" "$(job_result "Run ClerkKitUI tests on iOS")"

          update_check_run "$CHECK_RUN_NAME_PREFIX / Build iOS" "$(job_result "Build iOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Build macOS" "$(job_result "Build macOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Build macCatalyst" "$(job_result "Build macCatalyst")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Build watchOS" "$(job_result "Build watchOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Build tvOS" "$(job_result "Build tvOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Build visionOS" "$(job_result "Build visionOS")"

          if [ "$RUN_INTEGRATION_TESTS" = "true" ]; then
            update_check_run "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (auth-email)" "$(job_result "Run required E2EHost Maestro tests on iOS (auth-email)")"
            update_check_run "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (auth-phone)" "$(job_result "Run required E2EHost Maestro tests on iOS (auth-phone)")"
            update_check_run "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (user-profile)" "$(job_result "Run required E2EHost Maestro tests on iOS (user-profile)")"
            update_check_run "$CHECK_RUN_NAME_PREFIX / Run required E2EHost Maestro tests on iOS (session-task-setup-mfa)" "$(job_result "Run required E2EHost Maestro tests on iOS (session-task-setup-mfa)")"
          fi
