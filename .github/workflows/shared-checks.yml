name: Shared Checks

on:
  workflow_call:
    inputs:
      run_integration_tests:
        description: Run the integration tests and the macOS smoke build as part of shared checks
        required: false
        type: boolean
        default: false
      checkout_repository:
        description: Repository to checkout for shared checks
        required: false
        type: string
        default: ""
      checkout_ref:
        description: Git ref or SHA to checkout for shared checks
        required: false
        type: string
        default: ""
      report_check_runs:
        description: Report per-job check runs for manual PR CI
        required: false
        type: boolean
        default: false
      check_run_sha:
        description: Commit SHA to receive manual CI check runs
        required: false
        type: string
        default: ""
      check_run_target_url:
        description: Target URL for manual CI check runs
        required: false
        type: string
        default: ""
      check_run_name_prefix:
        description: Prefix for manual CI check run names
        required: false
        type: string
        default: Manual CI
      build_platforms:
        description: JSON array of the platforms to build ClerkKit for
        required: false
        type: string
        default: '["iOS", "macOS", "macCatalyst", "watchOS", "tvOS", "visionOS"]'
      e2e_runner_tests_base:
        description: Base branch of the PR; the E2E runner tests skip when no file they read changed since it
        required: false
        type: string
        default: ""
    secrets:
      CLERK_TEST_KEYS_JSON:
        required: false

permissions:
  contents: read

jobs:
  prepare-manual-ci-check-runs:
    name: Prepare manual CI check runs
    if: inputs.report_check_runs && inputs.check_run_sha != ''
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      check_runs_json: ${{ steps.create.outputs.check_runs_json }}
    steps:
      - name: Create in-progress check runs
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_NAME_PREFIX: ${{ inputs.check_run_name_prefix }}
          CHECK_RUN_SHA: ${{ inputs.check_run_sha }}
          CHECK_RUN_TARGET_URL: ${{ inputs.check_run_target_url }}
          BUILD_PLATFORMS: ${{ inputs.build_platforms }}
        run: |
          set -euo pipefail

          target_url="$CHECK_RUN_TARGET_URL"
          if [ -z "$target_url" ]; then
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          check_run_names=(
            "$CHECK_RUN_NAME_PREFIX / Check formatting and linting"
            "$CHECK_RUN_NAME_PREFIX / Run ClerkKit tests on macOS"
            "$CHECK_RUN_NAME_PREFIX / Run ClerkKitUI tests on iOS"
            "$CHECK_RUN_NAME_PREFIX / Run E2E runner tests"
          )
          while IFS= read -r platform; do
            check_run_names+=("$CHECK_RUN_NAME_PREFIX / Build $platform")
          done < <(jq -r '.[]' <<< "$BUILD_PLATFORMS")

          check_runs_json="$(jq -cn '{}')"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for name in "${check_run_names[@]}"; do
            check_run_id="$(
              gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
                -f name="$name" \
                -f head_sha="$CHECK_RUN_SHA" \
                -f status=in_progress \
                -f details_url="$target_url" \
                -f started_at="$started_at" \
                --jq '.id'
            )"
            check_runs_json="$(jq -c --arg name "$name" --argjson id "$check_run_id" '. + {($name): $id}' <<< "$check_runs_json")"
          done

          echo "check_runs_json=$check_runs_json" >> "$GITHUB_OUTPUT"

  format-and-lint:
    name: Check formatting and linting
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Install SwiftFormat
        run: ./scripts/install-swiftformat.sh

      - name: Install SwiftLint
        run: ./scripts/install-swiftlint.sh

      - name: Show formatter and linter versions
        run: |
          ./.tools/bin/swiftformat --version
          ./.tools/bin/swiftlint version

      - name: Check version consistency
        run: |
          set -euo pipefail
          ./scripts/check-version-consistency.sh

      - name: Check formatting and linting
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          make check

  test:
    name: Run ClerkKit tests on macOS
    needs: format-and-lint
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Cache Swift dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-macOS-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-macOS-

      - name: Run unit tests
        run: make test

      - name: Setup integration test keys
        if: inputs.run_integration_tests
        env:
          CLERK_TEST_KEYS_JSON: ${{ secrets.CLERK_TEST_KEYS_JSON }}
        run: |
          set +x
          if [ -z "$CLERK_TEST_KEYS_JSON" ]; then
            echo "❌ Error: CLERK_TEST_KEYS_JSON secret is not set"
            echo "   Please configure CLERK_TEST_KEYS_JSON secret in repository settings"
            exit 1
          fi

          printf '%s\n' "$CLERK_TEST_KEYS_JSON" > .keys.json
          chmod 600 .keys.json
          echo "✅ Created .keys.json from CLERK_TEST_KEYS_JSON secret"

      - name: Run integration tests
        if: inputs.run_integration_tests
        run: |
          set -euo pipefail
          make test-integration

      - name: Cleanup integration test keys
        if: always() && inputs.run_integration_tests
        run: |
          rm -f .keys.json
          echo "✅ Cleaned up .keys.json"

      - name: Run macOS smoke build
        if: ${{ !cancelled() && inputs.run_integration_tests }}
        run: make smoke-macos

  test-ui:
    name: Run ClerkKitUI tests on iOS
    needs: format-and-lint
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Name the Xcode build cache
        id: build-cache
        run: echo "prefix=clerkkitui-derived-data-${{ runner.arch }}-$(xcodebuild -version | tr -s ' \n' '-')" >> "$GITHUB_OUTPUT"

      # PR CI runs on comment and status events, which read and write main's cache scope. So only a push
      # saves the build, and only PR CI restores one. A push, the nightly and the release build from scratch,
      # so they never build on what PR CI saved, and they resolve the newest dependency releases.
      - name: Restore the Xcode build of the last main push
        if: github.event_name == 'issue_comment' || github.event_name == 'status' || github.event_name == 'pull_request_target' || github.event_name == 'workflow_run'
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.build-cache.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.build-cache.outputs.prefix }}

      # A restored cache gives every file a new inode, which XCBuild otherwise treats as a change.
      - name: Let Xcode ignore the inodes of a restored build
        run: defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      # Xcode rebuilds a Swift file when its modification time differs from the one it recorded, and a
      # checkout stamps every file with the current time. A time derived from the content keeps unchanged
      # files up to date and still rebuilds changed ones.
      - name: Give each file a modification time from its content
        run: |
          set -euo pipefail
          git ls-files -s -z | perl -0ne '
            my ($mode, $oid, $path) = /\A(\d+) ([0-9a-f]+) \d\t(.*)\0\z/s or die "unexpected ls-files entry: $_";
            next if $mode eq "120000" || $mode eq "160000";
            my $time = 946684800 + hex(substr($oid, 0, 7));
            utime($time, $time, $path) or die "$path: $!";
          '

      - name: Run ClerkKitUI tests
        run: make test-ui

      - name: Save the Xcode build for later runs
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ steps.build-cache.outputs.prefix }}${{ github.sha }}

  build:
    name: Build ${{ matrix.platform }}
    needs: [test, test-ui]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      matrix:
        platform: ${{ fromJSON(inputs.build_platforms) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Verify macOS and Xcode version
        run: |
          sw_vers
          xcodebuild -version

      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          echo "Building for ${{ matrix.platform }} using xcodebuild..."
          case "${{ matrix.platform }}" in
            iOS) destination="generic/platform=iOS Simulator" ;;
            macOS) destination="platform=macOS" ;;
            macCatalyst) destination="platform=macOS,variant=Mac Catalyst" ;;
            watchOS) destination="generic/platform=watchOS Simulator" ;;
            tvOS) destination="generic/platform=tvOS Simulator" ;;
            visionOS) destination="generic/platform=visionOS Simulator" ;;
            *) echo "❌ Unknown platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          xcodebuild build -workspace Clerk.xcworkspace -scheme ClerkKit -destination "$destination"

  e2e-runner-tests:
    name: Run E2E runner tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WATCHED: >-
        e2e-tests
        .github/scripts
        .github/workflows
        Examples/Quickstart/Quickstart.xcodeproj/project.pbxproj
    defaults:
      run:
        working-directory: e2e-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: ${{ inputs.e2e_runner_tests_base == '' && 1 || 0 }}
          persist-credentials: false

      - name: Check whether a file the tests read changed
        id: changed
        working-directory: .
        env:
          BASE: ${{ inputs.e2e_runner_tests_base }}
        run: |
          set -euo pipefail

          if [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --quiet "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE"
          if git diff --quiet "$(git merge-base FETCH_HEAD HEAD)" HEAD -- $WATCHED; then
            echo "::notice::No file the E2E runner tests read changed since $BASE, so they are skipped."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        if: steps.changed.outputs.run == 'true'
        run: npm ci

      - name: Run unit tests
        if: steps.changed.outputs.run == 'true'
        run: npm test

      - name: Typecheck
        if: steps.changed.outputs.run == 'true'
        run: npm run typecheck

      - name: Run the tests of the scripts in .github/scripts
        if: steps.changed.outputs.run == 'true'
        run: node --test ../.github/scripts/*.test.mjs

  report-manual-ci-check-runs:
    name: Report manual CI check runs
    needs:
      - prepare-manual-ci-check-runs
      - format-and-lint
      - test
      - test-ui
      - build
      - e2e-runner-tests
    if: always() && inputs.report_check_runs && inputs.check_run_sha != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
    steps:
      - name: Report final check runs
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_NAME_PREFIX: ${{ inputs.check_run_name_prefix }}
          CHECK_RUNS_JSON: ${{ needs.prepare-manual-ci-check-runs.outputs.check_runs_json }}
          CHECK_RUN_TARGET_URL: ${{ inputs.check_run_target_url }}
          BUILD_PLATFORMS: ${{ inputs.build_platforms }}
        run: |
          set -euo pipefail

          target_url="$CHECK_RUN_TARGET_URL"
          if [ -z "$target_url" ]; then
            target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100")"

          job_result() {
            local job_suffix="$1"
            jq -r --arg job_suffix "$job_suffix" '
              [.jobs[] | select(.name | endswith($job_suffix)) | .conclusion] | last // "skipped"
            ' <<< "$jobs_json"
          }

          check_run_id() {
            local name="$1"
            jq -r --arg name "$name" '.[$name] // empty' <<< "$CHECK_RUNS_JSON"
          }

          update_check_run() {
            local name="$1"
            local result="$2"
            local check_run_id
            local conclusion
            local summary

            check_run_id="$(check_run_id "$name")"
            if [ -z "$check_run_id" ]; then
              echo "::warning::No check run id found for '$name'."
              return
            fi

            case "$result" in
              success)
                conclusion="success"
                summary="Manual CI completed successfully."
                ;;
              cancelled)
                conclusion="cancelled"
                summary="Manual CI was cancelled."
                ;;
              skipped)
                conclusion="skipped"
                summary="Manual CI did not run because a dependency did not complete."
                ;;
              *)
                conclusion="failure"
                summary="Manual CI failed."
                ;;
            esac

            gh api --method PATCH "repos/$GITHUB_REPOSITORY/check-runs/$check_run_id" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f details_url="$target_url" \
              -f "output[title]=$name" \
              -f "output[summary]=$summary"
          }

          update_check_run "$CHECK_RUN_NAME_PREFIX / Check formatting and linting" "$(job_result "Check formatting and linting")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Run ClerkKit tests on macOS" "$(job_result "Run ClerkKit tests on macOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Run ClerkKitUI tests on iOS" "$(job_result "Run ClerkKitUI tests on iOS")"
          update_check_run "$CHECK_RUN_NAME_PREFIX / Run E2E runner tests" "$(job_result "Run E2E runner tests")"

          while IFS= read -r platform; do
            update_check_run "$CHECK_RUN_NAME_PREFIX / Build $platform" "$(job_result "Build $platform")"
          done < <(jq -r '.[]' <<< "$BUILD_PLATFORMS")
