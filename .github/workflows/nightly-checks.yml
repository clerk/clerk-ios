name: Nightly checks

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-ios'
    permissions:
      actions: read
      checks: write
      contents: read
    uses: ./.github/workflows/shared-checks.yml

  notify:
    name: Notify Slack of a failed nightly run
    needs: checks
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured; skipping Slack notification"
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          PAYLOAD=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run_url "$run_url" \
            '{
              text: "The nightly checks failed in \($repo)",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*The nightly checks failed in \($repo)*"
                  }
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: "<\($run_url)|View the run>"
                    }
                  ]
                }
              ]
            }')

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 60 \
            --retry-all-errors \
            --request POST \
            --header "Content-type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"
