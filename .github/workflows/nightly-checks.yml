name: Nightly checks

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Shared checks
    if: github.event_name != 'schedule' || github.repository == 'clerk/clerk-ios'
    permissions:
      actions: read
      checks: write
      contents: read
    uses: ./.github/workflows/shared-checks.yml
    with:
      run_integration_tests: true
    secrets:
      CLERK_TEST_KEYS_JSON: ${{ secrets.CLERK_TEST_KEYS_JSON }}

  notify:
    name: Notify Slack of a failed nightly run
    needs: checks
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out the script that lists the merged pull requests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/nightly-failure-message.mjs
          sparse-checkout-cone-mode: false

      # The message goes out without the list when the checkout or the script fails.
      - name: Notify Slack
        if: always()
        env:
          SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL is not configured; skipping Slack notification"
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message=":red_circle: $GITHUB_REPOSITORY nightly checks failed · <$run_url|View the run>"
          if since="$(timeout 120 node .github/scripts/nightly-failure-message.mjs nightly-checks.yml 'release-sdk.yml=Push, tag, and publish release')"; then
            message="$message"$'\n'"$since"
          else
            echo "::warning::Could not list the pull requests merged since the last passing run; the message has only its first line"
          fi

          PAYLOAD=$(jq -n --arg text "$message" '{text: $text, unfurl_links: false, unfurl_media: false}')

          curl --fail-with-body \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-max-time 60 \
            --retry-all-errors \
            --request POST \
            --header "Content-type: application/json" \
            --data "$PAYLOAD" \
            "$SLACK_MOBILE_TEAM_ALERTS_WEBHOOK_URL"
