name: CodeRabbit Approval

on:
  pull_request_review:
    types:
      - submitted

# Review events use the PR merge ref and have read-only tokens on forks. This
# workflow only signals the default-branch PR CI workflow through workflow_run.
# It neither checks out PR code nor needs repository write access.
permissions: {}

jobs:
  approval:
    name: Notify PR CI of CodeRabbit approval
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.id == 136622811 &&
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.user.type == 'Bot' &&
      github.event.sender.id == 136622811 &&
      github.event.review.commit_id == github.event.pull_request.head.sha
    runs-on: ubuntu-latest
    steps:
      - name: Signal the trusted CI gate
        run: echo 'CodeRabbit submitted an approval; PR CI will verify current eligibility.'
